# 취약점 스캐너. 이 사이트에 없는 PHP·워드프레스·설정 파일 주소를 찾는 IP. Caddy 가 404 로 답하고(guard), 여기서 IP 를 막는다.
# 주소의 경로 부분(? 앞)만 본다. 검색어에 .php 가 들어간 사람은 걸리지 않는다.
[Definition]
failregex = ^\{.*"client_ip":"<HOST>".*"uri":"[^"?]*(?:\.php|\.aspx?|\.jsp|\.cgi|/wp-|/wordpress|/\.env|/\.git|/\.aws|/\.ssh|/cgi-bin/|/vendor/|/phpmyadmin|/boaform|/actuator|/xmlrpc|/HNAP1)
ignoreregex =
datepattern = "ts":"%%Y-%%m-%%dT%%H:%%M:%%S(?:\.%%f)?%%z"
