# 너무 빠른 IP. Caddy 접속 기록(JSON 한 줄)에서 "쪽·API 요청"만 센다.
# 세지 않는 것:
#  - 정적 파일(/_next/, 그림·글꼴·css·js, 아이콘). 쪽 하나를 열면 수십 개가 따라온다.
#  - Next 미리 받기(?_rsc=). 목록을 내리면 링크마다 저절로 나간다. 사람도 1분에 수백 번 낸다.
#  - 검색엔진·광고 봇(ignoreregex). 색인을 막으면 안 된다. 이름표를 속이면 못 거르지만, 그런 봇은 Caddy 목록으로 막는다.
[Definition]
failregex = ^\{.*"client_ip":"<HOST>".*"uri":"(?![^"]*[?&]_rsc=)(?!/_next/)(?!/(?:favicon|icon|apple-icon)[^"]*")(?![^"?]*\.(?:png|jpe?g|gif|webp|avif|svg|ico|css|js|map|woff2?|ttf|txt|xml)(?:[?"]))[^"]*"
ignoreregex = "User-Agent":\["[^"]*(?:Googlebot|Google-InspectionTool|AdsBot-Google|Mediapartners-Google|APIs-Google|Storebot-Google|GoogleOther|bingbot|Yeti|Daum|DuckDuckBot|Applebot)
datepattern = "ts":"%%Y-%%m-%%dT%%H:%%M:%%S(?:\.%%f)?%%z"
