name: db-backup

# 매일 새벽 DB 전체를 pg_dump 로 떠서 S3 에 올린다. Supabase 무료 요금제에는 백업이 없다.
# 30일 지난 것은 S3 수명 주기 규칙이 지운다(아래에서 매번 같은 규칙을 다시 건다 — 한 번만 적용됨).
#
# 필요한 secret (하나라도 없으면 건너뛴다)
#   SUPABASE_DB_URL        postgresql://postgres.<ref>:<비밀번호>@aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres
#                          (Supabase → Connect → Session pooler. 직접 연결 주소도 된다)
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY   그 버킷에 쓰기만 되는 IAM 사용자
#   AWS_REGION             ap-northeast-2
#   BACKUP_BUCKET          예: jiwon-db-backup (미리 만들어 둔 비공개 버킷)
on:
  schedule:
    - cron: "30 18 * * *"   # UTC 18:30 = KST 03:30
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      BUCKET: ${{ secrets.BACKUP_BUCKET }}
    steps:
      - name: 설정이 다 있나
        id: gate
        run: |
          if [ -z "$DB_URL" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$BUCKET" ]; then
            echo "SUPABASE_DB_URL·AWS 키·BACKUP_BUCKET 중 빈 것이 있어 건너뜁니다."; echo "go=0" >> "$GITHUB_OUTPUT"
          else echo "go=1" >> "$GITHUB_OUTPUT"; fi

      # Supabase 는 Postgres 17 이라 pg_dump 도 17 이어야 한다(러너 기본은 16).
      - name: pg_dump 17
        if: steps.gate.outputs.go == '1'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17 >/dev/null

      - name: 덤프
        if: steps.gate.outputs.go == '1'
        run: |
          set -euo pipefail
          name="jiwon-$(date -u +%Y%m%d-%H%M).dump"
          # custom 형식(-Fc): 압축되고 표 단위로 골라 복원할 수 있다. 공개 스키마만.
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" -Fc --no-owner --no-privileges -n public -f "$name"
          ls -lh "$name"
          echo "name=$name" >> "$GITHUB_ENV"

      - name: S3 에 올리기
        if: steps.gate.outputs.go == '1'
        run: |
          set -euo pipefail
          aws s3 cp "$name" "s3://$BUCKET/db/$name" --only-show-errors
          # 30일 지난 백업은 지운다. 같은 규칙을 매번 걸어도 결과는 같다.
          aws s3api put-bucket-lifecycle-configuration --bucket "$BUCKET" --lifecycle-configuration '{"Rules":[{"ID":"expire-30d","Status":"Enabled","Filter":{"Prefix":"db/"},"Expiration":{"Days":30}}]}' || true
          aws s3 ls "s3://$BUCKET/db/" | tail -5
          rm -f "$name"
