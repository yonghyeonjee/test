name: deploy-aws

# AWS Lightsail(서울) 서버로 배포한다. 빌드는 여기서(서버는 1GB 라 빌드하지 않는다) 하고,
# .next/standalone 한 벌을 서버의 /srv/jiwon/releases/<커밋> 에 올린 뒤 current 로 잇고 다시 띄운다.
#
# 서버 준비는 deploy/lightsail/README.md. LIGHTSAIL_HOST 가 비어 있으면 아무것도 하지 않는다
# (이전 전에는 Vercel 이 그대로 배포한다).
#
# 필요한 secret
#   서버 접속: LIGHTSAIL_HOST(고정 IP), LIGHTSAIL_SSH_KEY(Lightsail 키 쌍의 개인 키 전체)
#   빌드에 들어가는 공개값: NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY, NEXT_PUBLIC_KAKAO_MAP_KEY,
#     NEXT_PUBLIC_GTM_ID, NEXT_PUBLIC_TURNSTILE_SITE_KEY (없는 것은 비워 둬도 된다)
#   서버 비밀값: SUPABASE_SERVICE_KEY, ADMIN_USER, ADMIN_PASSWORD, ADMIN_SECRET, CRON_SECRET, GH_DISPATCH_TOKEN,
#     DATA_GO_KR_KEY, ALIOPLUS_API_KEY, ALIOPLUS_KEY_APBA, ALIOPLUS_KEY_BUSINESS, ALIOPLUS_KEY_EVENT,
#     ALIOPLUS_KEY_FACILITY, TURNSTILE_SECRET_KEY
#   알림 메일(없으면 시험 모드): BREVO_API_KEY+MAIL_FROM(무료 하루 300통) 또는 RESEND_API_KEY(무료 달 3,000통)
#   또는 AWS_REGION, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY(SES 보내기만 되는 IAM 사용자)+MAIL_FROM
#   로그인 세션 서명: SESSION_SECRET(없으면 ADMIN_SECRET)

on:
  push:
    branches: [main]
    paths: ["web/**", "deploy/lightsail/**", ".github/workflows/deploy_aws.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HOST: ${{ secrets.LIGHTSAIL_HOST }}
    steps:
      - name: 서버가 정해졌나
        id: gate
        run: |
          if [ -z "$HOST" ]; then echo "LIGHTSAIL_HOST 가 비어 있어 건너뜁니다(아직 Vercel)."; echo "go=0" >> "$GITHUB_OUTPUT"; else echo "go=1" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.go == '1'

      - uses: actions/setup-node@v5
        if: steps.gate.outputs.go == '1'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 빌드
        if: steps.gate.outputs.go == '1'
        working-directory: web
        env:
          STANDALONE: "1"
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_KAKAO_MAP_KEY: ${{ secrets.NEXT_PUBLIC_KAKAO_MAP_KEY }}
          NEXT_PUBLIC_GTM_ID: ${{ secrets.NEXT_PUBLIC_GTM_ID }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_SITE_URL: https://jiwon.knowhow-it.com
        run: |
          npm ci
          npm run build
          # standalone 에는 정적 파일이 빠져 있다. 같이 묶는다.
          mkdir -p ../bundle
          cp -r .next/standalone/. ../bundle/
          cp -r .next/static ../bundle/.next/static
          cp -r public ../bundle/public
          cp ../deploy/lightsail/jiwon.service ../bundle/jiwon.service
          cp ../deploy/lightsail/Caddyfile ../bundle/Caddyfile
          cp ../deploy/lightsail/maintenance.html ../bundle/maintenance.html
          cp ../deploy/lightsail/jiwon-watchdog.sh ../deploy/lightsail/jiwon-watchdog.service ../deploy/lightsail/jiwon-watchdog.timer ../bundle/
          # 봇 막기: fail2ban 규칙·감옥, 설치 스크립트, 접속 기록 요약(server_diag 가 부른다)
          cp -r ../deploy/lightsail/fail2ban ../bundle/fail2ban
          cp ../deploy/lightsail/botguard.sh ../deploy/lightsail/access_report.py ../deploy/lightsail/bot_report.py ../bundle/
          tar -C ../bundle -czf ../bundle.tgz .
          ls -lh ../bundle.tgz

      - name: Caddy 설정 검사
        if: steps.gate.outputs.go == '1'
        run: |
          # caddyserver.com 의 다운로드 API 는 그때그때 빌드해 주는 것이라 20분 넘게 매달린 적이 있다(2026-10-22, 배포가 통째로 멈춤).
          # GitHub 릴리스의 완성된 바이너리를 받고, 60초 안에 안 오면 포기한다. 서버 쪽에서 배포 때 다시 validate 하므로 여기는 미리 보기다.
          V=2.9.1
          if curl -sSL --retry 2 --max-time 60 "https://github.com/caddyserver/caddy/releases/download/v$V/caddy_${V}_linux_amd64.tar.gz" -o /tmp/caddy.tgz \
             && tar -xzf /tmp/caddy.tgz -C /tmp caddy; then
            chmod +x /tmp/caddy && /tmp/caddy version
          else
            echo "::warning::caddy 를 받지 못해 러너 쪽 설정 검사를 건너뛴다(서버에서 다시 검사한다)"; exit 0
          fi
          # 검사는 접속 기록 파일을 실제로 열어 본다. 러너는 일반 사용자라 /var/log/caddy 를 못 만든다(2026-10-14 첫 배포가 여기서 멈춤).
          sudo install -d -m 777 /var/log/caddy
          [ -x /tmp/caddy ] && /tmp/caddy validate --config deploy/lightsail/Caddyfile --adapter caddyfile

      # 규칙이 쪽 요청만 세고 검색엔진·정적 파일·미리 받기를 빼는지, 감옥 설정이 읽히는지. 틀리면 서버에 안 올린다.
      - name: fail2ban 규칙 시험
        if: steps.gate.outputs.go == '1'
        run: |
          sudo apt-get update -q >/dev/null && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q fail2ban >/dev/null
          bash deploy/lightsail/fail2ban/test.sh

      - name: 서버 비밀값 파일
        if: steps.gate.outputs.go == '1'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_KAKAO_MAP_KEY: ${{ secrets.NEXT_PUBLIC_KAKAO_MAP_KEY }}
          NEXT_PUBLIC_GTM_ID: ${{ secrets.NEXT_PUBLIC_GTM_ID }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          ALIOPLUS_API_KEY: ${{ secrets.ALIOPLUS_API_KEY }}
          ALIOPLUS_KEY_APBA: ${{ secrets.ALIOPLUS_KEY_APBA }}
          ALIOPLUS_KEY_BUSINESS: ${{ secrets.ALIOPLUS_KEY_BUSINESS }}
          ALIOPLUS_KEY_EVENT: ${{ secrets.ALIOPLUS_KEY_EVENT }}
          ALIOPLUS_KEY_FACILITY: ${{ secrets.ALIOPLUS_KEY_FACILITY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          umask 077
          : > env.prod
          for k in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY NEXT_PUBLIC_KAKAO_MAP_KEY NEXT_PUBLIC_GTM_ID \
                   NEXT_PUBLIC_TURNSTILE_SITE_KEY SUPABASE_SERVICE_KEY ADMIN_USER ADMIN_PASSWORD ADMIN_SECRET CRON_SECRET \
                   GH_DISPATCH_TOKEN DATA_GO_KR_KEY ALIOPLUS_API_KEY ALIOPLUS_KEY_APBA ALIOPLUS_KEY_BUSINESS \
                   ALIOPLUS_KEY_EVENT ALIOPLUS_KEY_FACILITY TURNSTILE_SECRET_KEY \
                   SESSION_SECRET AWS_REGION AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY MAIL_FROM BREVO_API_KEY RESEND_API_KEY; do
            v="${!k}"
            [ -n "$v" ] && printf '%s=%s\n' "$k" "$v" >> env.prod
          done
          echo "NEXT_PUBLIC_SITE_URL=https://jiwon.knowhow-it.com" >> env.prod
          echo "값 $(wc -l < env.prod)개"

      - name: 올리기·다시 띄우기
        if: steps.gate.outputs.go == '1'
        env:
          KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          # 같은 커밋을 다시 올려도 새 폴더에 푼다. 돌고 있는 폴더를 지우지 않으려고.
          # run_attempt 까지 붙인다 — "다시 실행" 은 run_id 가 같아 돌고 있는 폴더에 풀려다
          # 서비스가 만든 캐시 파일의 chmod 에서 멈췄다(2026-10-08, 서버가 굳은 날 되살리기가 늦어진 원인).
          REL: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id
          # 서버가 느릴 때(메모리 부족으로 굳은 2026-10-08) keyscan 기본 5초에 걸려 배포가 첫 줄에서 죽었다.
          # 호스트 키는 20초까지 기다리되 못 받아도 넘어가고, 접속은 StrictHostKeyChecking=no 로 한다.
          ssh-keyscan -T 20 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          O="-o ConnectTimeout=25 -o StrictHostKeyChecking=no -o ServerAliveInterval=15"
          S="ssh $O -i $HOME/.ssh/id ubuntu@$HOST"
          scp $O -i ~/.ssh/id bundle.tgz "ubuntu@$HOST:/tmp/bundle-$REL.tgz"
          $S "cat > /srv/jiwon/shared/.env" < env.prod
          $S "set -e
            D=/srv/jiwon/releases/$REL
            mkdir -p \$D && tar -C \$D -xzf /tmp/bundle-$REL.tgz && rm /tmp/bundle-$REL.tgz
            mkdir -p \$D/.next/cache && chmod -R g+rwX \$D
            ln -sfn \$D /srv/jiwon/current
            # 서비스 정의(환경변수·메모리 한도)가 바뀌었으면 같이 갱신한다.
            if ! cmp -s \$D/jiwon.service /etc/systemd/system/jiwon.service; then
              sudo install -m 644 \$D/jiwon.service /etc/systemd/system/jiwon.service && sudo systemctl daemon-reload
            fi
            # 점검 화면과 Caddy 설정. 점검 화면은 배포 폴더 밖(static)에 둬 서비스가 죽어도 Caddy 가 찾는다.
            sudo mkdir -p /srv/jiwon/static && sudo install -m 644 \$D/maintenance.html /srv/jiwon/static/maintenance.html
            # 접속 기록 폴더(Caddyfile 의 access). Caddy 는 caddy 사용자로 돌아 이 폴더·파일이 caddy 것이어야 연다.
            sudo install -d -o caddy -g caddy -m 755 /var/log/caddy
            # Caddy 설정. 마지막으로 다시 읽기에 성공한 판(Caddyfile.applied)과 비교한다 — /etc/caddy/Caddyfile 과
            # 비교하면, 깔았는데 다시 읽기에 실패한 판이 \"같다\"로 보여 영영 적용되지 않는다.
            # 2026-10-14: root 로 돈 validate 가 access.log 를 root 소유(0600)로 먼저 만들어, caddy 가 못 열고 reload 가 실패했다.
            # 그래서 validate 뒤에 소유를 되돌리고, reload 가 실패하면 설정 파일을 직전 정상본으로 되돌린다(재부팅해도 뜨게).
            if ! sudo cmp -s \$D/Caddyfile /etc/caddy/Caddyfile.applied; then
              sudo caddy validate --config \$D/Caddyfile --adapter caddyfile
              sudo chown -R caddy:caddy /var/log/caddy
              [ -f /etc/caddy/Caddyfile.applied ] || sudo cp /etc/caddy/Caddyfile /etc/caddy/Caddyfile.before
              sudo install -m 644 \$D/Caddyfile /etc/caddy/Caddyfile
              if sudo systemctl reload caddy; then
                sudo install -m 644 \$D/Caddyfile /etc/caddy/Caddyfile.applied
              else
                sudo journalctl -u caddy -n 5 --no-pager -o cat
                if [ -f /etc/caddy/Caddyfile.applied ]; then sudo cp /etc/caddy/Caddyfile.applied /etc/caddy/Caddyfile; else sudo cp /etc/caddy/Caddyfile.before /etc/caddy/Caddyfile; fi
                echo '::error::Caddy 가 새 설정을 다시 읽지 못했다. 설정 파일은 배포 전 상태로 되돌렸고, 돌던 Caddy 는 옛 설정 그대로다.'
                exit 1
              fi
            fi
            # 지킴이: 3000 이 답하지 않으면 다시 띄우는 타이머(1분). 파일이 바뀌었을 때만 갱신·재시동.
            if ! cmp -s \$D/jiwon-watchdog.sh /usr/local/bin/jiwon-watchdog.sh || ! cmp -s \$D/jiwon-watchdog.timer /etc/systemd/system/jiwon-watchdog.timer || ! cmp -s \$D/jiwon-watchdog.service /etc/systemd/system/jiwon-watchdog.service; then
              sudo install -m 755 \$D/jiwon-watchdog.sh /usr/local/bin/jiwon-watchdog.sh
              sudo install -m 644 \$D/jiwon-watchdog.service /etc/systemd/system/jiwon-watchdog.service
              sudo install -m 644 \$D/jiwon-watchdog.timer /etc/systemd/system/jiwon-watchdog.timer
              sudo systemctl daemon-reload && sudo systemctl enable --now jiwon-watchdog.timer
            fi
            sudo /usr/bin/systemctl restart jiwon
            # 봇 막기(fail2ban). 사이트를 띄운 뒤에 한다. 실패해도 배포는 계속한다(경고만).
            sudo bash \$D/botguard.sh \$D || echo '::warning::봇 막기(fail2ban) 설치·갱신 실패. 사이트는 그대로 돈다.'
            # 지난 배포는 셋만 남긴다. 서비스(jiwon)가 쓴 캐시 파일이 섞여 있어 sudo 로 지운다.
            # 수정 시각(-t)으로 고르면 안 된다. 돌던 배포는 쪽 캐시를 계속 써서 늘 \"최신\"으로 보여, 3.3GB 짜리 옛 폴더가
            # 살아남고 그보다 새 폴더가 지워졌다(2026-10-09). 폴더 이름의 실행 번호(run_id)로 줄 세우고, current 는 절대 안 지운다.
            CUR=\$(readlink -f /srv/jiwon/current)
            for d in \$(ls -1d /srv/jiwon/releases/* | awk -F- '{print \$(NF-1), \$0}' | sort -n | head -n -3 | cut -d' ' -f2); do
              [ \"\$d\" = \"\$CUR\" ] || sudo rm -rf \"\$d\"
            done"
          for i in $(seq 1 30); do
            code=$($S "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/" || true)
            echo "확인 $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 2
          done
          $S "sudo /usr/bin/journalctl -u jiwon -n 80 --no-pager" || true
          echo "::error::서버가 200 을 내지 않습니다."
          exit 1
