name: server-cleanup

# 서버 디스크 비우기(2026-11-09). 디스크가 100% 차서 쪽이 20~60초 걸리고 503 이 났다.
# 먼저 어디가 큰지 적고, 지워도 안전한 것만 지운 뒤, 다시 잰다. 매주 일요일 새벽(KST)에도 돈다.
on:
  workflow_dispatch:
    inputs:
      deep:
        description: "지금 배포의 Next 자료 캐시(fetch-cache)까지 비운다(쪽이 잠깐 느려질 수 있음)"
        type: boolean
        default: false
  schedule:
    - cron: "30 18 * * 6"   # 일요일 03:30 KST

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.LIGHTSAIL_HOST }}
      KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
      DEEP: ${{ inputs.deep }}
    steps:
      - name: 디스크 비우기
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id
          ssh-keyscan -T 20 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          S="ssh -o ConnectTimeout=20 -o ServerAliveInterval=15 -o StrictHostKeyChecking=no -i $HOME/.ssh/id ubuntu@$HOST"
          $S "DEEP='$DEEP' bash -s" <<'REMOTE'
            set +e
            echo "== 비우기 전"; df -h / | tail -1
            echo; echo "== 큰 폴더(200MB 넘는 것, 깊이 3)"
            sudo timeout 240 du -xh --max-depth=3 --threshold=200M / 2>/dev/null | sort -h | tail -25
            echo; echo "== 큰 파일(200MB 넘는 것)"
            sudo timeout 120 find / -xdev -type f -size +200M -printf "%s\t%p\n" 2>/dev/null | sort -n | awk '{printf "%6.1fG %s\n",$1/1073741824,$2}' | tail -20
            echo; echo "== 지우기"
            echo "-- 배포하다 남은 묶음(/tmp/bundle-*.tgz)"; sudo ls -lh /tmp/bundle-*.tgz 2>/dev/null; sudo rm -f /tmp/bundle-*.tgz /tmp/caddy.tgz /tmp/caddy
            echo "-- journal 100MB 로"; sudo journalctl --vacuum-size=100M 2>&1 | tail -2
            echo "-- apt 캐시"; sudo apt-get clean
            echo "-- 회전된 로그(.gz, .1 중 3일 지난 것)"; sudo find /var/log -xdev -type f \( -name "*.gz" -o -name "*.[0-9]" -o -name "*.[0-9].log" \) -mtime +3 -print -delete 2>/dev/null | wc -l
            echo "-- 비대한 현재 로그(500MB 넘으면 비움)"; for f in /var/log/syslog /var/log/kern.log /var/log/auth.log /var/log/caddy/access.log /var/log/fail2ban.log; do
              [ -f "$f" ] && [ "$(sudo stat -c %s "$f")" -gt 524288000 ] && { echo "  truncate $f ($(sudo du -h "$f" | cut -f1))"; sudo truncate -s 0 "$f"; }
            done; true
            echo "-- 크래시 덤프·apport"; sudo rm -rf /var/crash/* /var/lib/apport/coredump/* 2>/dev/null; true
            echo "-- snap 옛 판"; sudo snap set system refresh.retain=2 2>/dev/null; snap list --all 2>/dev/null | awk '/disabled/{print $1, $3}' | while read n r; do sudo snap remove "$n" --revision="$r" 2>/dev/null; done; true
            echo "-- npm 캐시"; sudo rm -rf /home/ubuntu/.npm/_cacache /root/.npm/_cacache 2>/dev/null; true
            echo "-- current 가 아닌 배포본의 Next 캐시"; CUR=$(readlink -f /srv/jiwon/current)
            for d in /srv/jiwon/releases/*/; do d=${d%/}; [ "$d" = "$CUR" ] && continue; sudo du -sh "$d/.next/cache" 2>/dev/null; sudo rm -rf "$d/.next/cache"/* ; done; true
            echo "-- current 의 그림 캐시(images)"; sudo du -sh "$CUR/.next/cache/images" 2>/dev/null; sudo rm -rf "$CUR/.next/cache/images"/* 2>/dev/null; true
            if [ "$DEEP" = "true" ]; then echo "-- current 의 자료 캐시(fetch-cache)"; sudo du -sh "$CUR/.next/cache/fetch-cache" 2>/dev/null; sudo rm -rf "$CUR/.next/cache/fetch-cache"/* 2>/dev/null; fi; true
            echo "-- docker"; command -v docker >/dev/null && sudo docker system prune -af 2>&1 | tail -1; true
            echo; echo "== 비운 뒤"; df -h / | tail -1
            echo; echo "== 서비스"; systemctl is-active jiwon caddy fail2ban | tr '\n' ' '; echo
            curl -s -o /dev/null -m 20 -w "3000 포트 %{http_code} %{time_total}s\n" http://127.0.0.1:3000/ || echo "3000 포트 응답 없음"
            free -m | sed -n 2p; uptime
REMOTE
