name: blog-daily

# 모아 둔 자료로 매일 블로그 글 한 편. 수집·정규화가 끝난 아침에 돈다.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: "갈래 (비우면 오늘 차례)"
        required: false
        type: choice
        options: ["", "topic", "org", "role", "region"]
      subject:
        description: "글감 (기관 이름, 직무 key, 주제 slug, 시·도)"
        required: false
        type: string
  schedule:
    - cron: "30 0 * * *"    # UTC 00:30 = KST 09:30

concurrency:
  group: blog-daily
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python pipeline/test_blog_daily.py
      - name: 글 쓰기
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          KIND: ${{ inputs.kind }}
          SUBJECT: ${{ inputs.subject }}
        run: |
          args=""
          [ -n "$KIND" ] && args="$args --kind $KIND"
          [ -n "$SUBJECT" ] && args="$args --subject \"$SUBJECT\""
          eval python -u pipeline/blog_daily.py $args
