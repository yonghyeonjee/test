name: tistory-publish

# blog_daily 가 쓴 글을 티스토리(abcfact.tistory.com)에도 올린다. 기본은 요약 + 원문 링크.
# 티스토리 공개 API 는 끝났으므로 관리자 내부 주소를 로그인 쿠키로 부른다(pipeline/tistory_publish.py).
#
# 필요한 secret
#   TISTORY_COOKIE   로그인한 브라우저에서 abcfact.tistory.com/manage 요청의 Cookie 헤더 전체(README '티스토리' 절).
#                    비어 있으면 경고만 내고 그냥 끝난다. 만료되면 종료 코드 2 로 빨갛게 실패한다 → 갱신.
# 선택 variable (Settings → Variables)
#   TISTORY_CATEGORY 카테고리 id(정수). 비우면 글마다 고른다(채용·공무원·복지 policy, 자격증 일상TIP, 기업지원 B2G). 목록은 check=true 로 본다.
on:
  workflow_dispatch:
    inputs:
      check:
        description: "쿠키 확인 + 카테고리 id 목록만(올리지 않음)"
        default: false
        type: boolean
      slug:
        description: "이 글 하나만(비우면 어제·오늘 쓴 글 중 아직 안 올린 것)"
        required: false
        type: string
      mode:
        description: "요약(summary) 또는 전문(full)"
        default: "summary"
        type: choice
        options: ["summary", "full"]
      visibility:
        description: "공개 범위(처음 시험할 땐 private)"
        default: "public"
        type: choice
        options: ["public", "private", "protected"]
      dry:
        description: "올리지 않고 HTML 만 찍어 본다"
        default: false
        type: boolean
      top10:
        description: "먼저 '많이 뽑는 직무 TOP10' 글을 DB 에 쓴다(blog_top_roles.py). slug 는 그 글로 맞춘다"
        default: false
        type: boolean
      shots:
        description: "본문에 끼울 화면 사진: '주소|파일이름|설명|선택자' 를 쉼표로(pipeline/shot_pages.py). 비우면 사진 없음"
        required: false
        type: string
      update:
        description: "새 글 대신 이 티스토리 글 번호(숫자 id)를 고쳐 쓴다. 번호는 check=true 가 찍는 최근 글 목록에서"
        required: false
        type: string
      replace:
        description: "짧은 글 번호들(쉼표)을 모음 글 하나로 합쳐 새로 올리고 원래 글은 지운다(예: 168,169,170,171)"
        required: false
        type: string
      composer:
        description: "티스토리용 글을 따로 쓴다(jiwon 글은 출처). top10 = 많이 뽑는 직무 순위"
        default: ""
        type: choice
        options: ["", "top10"]
      charts:
        description: "TOP10 글의 사진을 자료 차트로 그린다(chart_top_roles.py). shots 의 open.png 가 있으면 첫 장으로 둔다"
        default: false
        type: boolean
      top10_topic:
        description: "순위 연재 한 편을 지금 낸다(top10.py --list 의 주제 키, 예: civil). jiwon 에 쓰고 차트 그려 composer top10 으로 올린다. slug/charts/composer 입력은 무시"
        required: false
        type: string
      script:
        description: "티스토리 단독 글: pipeline/ 의 글 생성기(out/post.json + shots/)를 돌려 올린다. 예: world_speed.py(전세계 인터넷 속도 TOP10)"
        default: ""
        type: choice
        options: ["", "world_speed.py", "ai_series.py"]
      script_arg:
        description: "script 에 넘길 글 slug(ai_series.py 일 때, 예: vibe-coding-top10)"
        required: false
        type: string
  schedule:
    - cron: "0 3 * * *"    # UTC 03:00 = KST 12:00. blog_daily(00:30) 가 몇 시간 늦어도 끝난 뒤.

concurrency:
  group: tistory-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python pipeline/test_tistory_publish.py
      - name: TOP10 글 먼저 쓰기
        if: inputs.top10
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -u pipeline/blog_top_roles.py
      - name: 순위 연재 글 쓰기(top10)
        if: inputs.top10_topic != ''
        id: top10
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TOPIC: ${{ inputs.top10_topic }}
        run: |
          pip install -q matplotlib
          python pipeline/test_top10.py
          python -u pipeline/top10.py --topic "$TOPIC" | tee out.txt
          grep '^SLUG=' out.txt >> "$GITHUB_OUTPUT"
      - name: 단독 글 만들기(script)
        if: inputs.script != ''
        env:
          SCRIPT: ${{ inputs.script }}
          SCRIPT_ARG: ${{ inputs.script_arg }}
        run: |
          sudo apt-get install -y -qq fonts-nanum >/dev/null 2>&1 || echo "::warning::fonts-nanum 설치 실패"
          fc-cache -f >/dev/null 2>&1 || true
          pip install -q matplotlib
          if [ -n "$SCRIPT_ARG" ]; then python -u "pipeline/$SCRIPT" --slug "$SCRIPT_ARG"; else python -u "pipeline/$SCRIPT"; fi
      - name: 화면 사진 찍기
        if: inputs.shots != ''
        env:
          SHOTS: ${{ inputs.shots }}
        run: python -u pipeline/shot_pages.py "$SHOTS"
      - name: 자료 차트 그리기
        if: inputs.charts || inputs.top10_topic != ''
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SLUG: ${{ steps.top10.outputs.SLUG || inputs.slug }}
          TOP10: ${{ inputs.top10_topic }}
        run: |
          sudo apt-get install -y -qq fonts-nanum >/dev/null 2>&1 || echo "::warning::fonts-nanum 설치 실패 — 한글이 네모로 나올 수 있다"
          fc-cache -f >/dev/null 2>&1 || true
          pip install -q matplotlib
          if [ -n "$TOP10" ]; then
            [ -f shots/open.png ] || python -u pipeline/shot_pages.py "/jobs/status/open|open|지금 접수 중인 공공기관 채용 공고 (출처: K나라지원)|" || echo "::warning::화면 사진 실패 — 차트만 넣는다"
            python -u pipeline/shot_top10.py --slug "$SLUG" || echo "::warning::항목 화면 일부 실패 — 차트만 넣는다"
            python -u pipeline/chart_top10.py --slug "$SLUG"
          else
            python -u pipeline/chart_top_roles.py --slug "$SLUG"
          fi
      - uses: actions/upload-artifact@v4
        if: always() && (inputs.shots != '' || inputs.charts || inputs.top10_topic != '' || inputs.script != '')
        with:
          name: shots
          path: shots/
          if-no-files-found: ignore
          retention-days: 7
      - name: 티스토리에 올리기
        env:
          TISTORY_COOKIE:       ${{ secrets.TISTORY_COOKIE }}
          TISTORY_CATEGORY:     ${{ vars.TISTORY_CATEGORY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CHECK: ${{ inputs.check }}
          SLUG: ${{ inputs.slug }}
          MODE: ${{ inputs.mode || 'summary' }}
          VISIBILITY: ${{ inputs.visibility || 'public' }}
          DRY: ${{ inputs.dry }}
          SHOTS: ${{ inputs.shots }}
          UPDATE: ${{ inputs.update }}
          REPLACE: ${{ inputs.replace }}
          COMPOSER: ${{ inputs.composer }}
          TOP10_SLUG: ${{ steps.top10.outputs.SLUG }}
          SCRIPT: ${{ inputs.script }}
        run: |
          if [ -n "$TOP10_SLUG" ]; then SLUG="$TOP10_SLUG"; COMPOSER="top10"; MODE="full"; fi
          if [ -n "$SCRIPT" ]; then SLUG=""; COMPOSER=""; MODE="full"; fi
          if [ -z "$TISTORY_COOKIE" ] && [ "$DRY" != "true" ]; then
            echo "::warning::TISTORY_COOKIE 가 없어 건너뜀. 로그인 쿠키를 secret 에 넣으면 올라간다(README '티스토리' 절)."
            exit 0
          fi
          args="--mode $MODE --visibility $VISIBILITY"
          [ "$CHECK" = "true" ] && args="--check"
          [ -n "$SLUG" ] && args="$args --slug \"$SLUG\""
          [ "$DRY" = "true" ] && args="$args --dry"
          [ -f shots/manifest.json ] && args="$args --images shots/manifest.json"
          [ -n "$UPDATE" ] && args="$args --update \"$UPDATE\""
          [ -n "$REPLACE" ] && args="$args --replace \"$REPLACE\""
          [ -n "$COMPOSER" ] && args="$args --composer $COMPOSER"
          [ -n "$SCRIPT" ] && args="$args --post-json out/post.json"
          eval python -u pipeline/tistory_publish.py $args
