name: home-loan-rates

# 보금자리론·디딤돌 금리표. 달마다 1일에 바뀌므로 매달 1~3일 아침과 매주 월요일 아침에만 읽는다(2026-10-08 까지는 매일).
on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 1-3 * *"  # UTC 22:00 = KST 07:00, 매달 1~3일(월초 변경분)
    - cron: "0 22 * * 1"    # 매주 월요일 07:00 KST(그 사이 정정분)

jobs:
  rates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python pipeline/test_home_loan_rates.py
      - name: 금리표 갱신
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -u pipeline/home_loan_rates.py
