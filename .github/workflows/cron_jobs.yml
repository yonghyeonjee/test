name: cron-jobs

# 매일 09:00 KST "최신" 수집. Vercel 크론(vercel.json)이 하던 일을 AWS 로 옮겨 여기서 한다.
# 필요한 secret: CRON_SECRET

on:
  schedule:
    - cron: "0 0 * * *"   # UTC 00:00 = KST 09:00
  workflow_dispatch:

jobs:
  latest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 최신 수집
        env:
          SITE: https://jiwon.knowhow-it.com
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -u
          [ -n "$CRON_SECRET" ] || { echo "::error::CRON_SECRET 이 비어 있습니다."; exit 1; }
          # 한 번에 끝나지 않으면 응답의 more 가 true — 끝날 때까지 다시 부른다(최대 20회).
          for round in $(seq 1 20); do
            body=$(curl -sS --max-time 120 -H "Authorization: Bearer $CRON_SECRET" "$SITE/api/cron/jobs") || { echo "요청 실패(회차 $round)"; exit 1; }
            echo "회차 $round: $(echo "$body" | head -c 400)"
            [ "$(echo "$body" | jq -r '.more // false' 2>/dev/null)" = "true" ] || exit 0
            sleep 2
          done

  # 새로 들어온 나라일터 공고의 상세(첨부파일·근무지역). 접수 중인 것 가운데 아직 안 읽은 것만.
  detail:
    needs: latest
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 나라일터 상세
        env:
          SITE: https://jiwon.knowhow-it.com
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -u
          for round in $(seq 1 30); do
            body=$(curl -sS --max-time 100 -H "Authorization: Bearer $CRON_SECRET" "$SITE/api/cron/orgsites?step=gojobs_detail") || { echo "요청 실패(회차 $round)"; exit 1; }
            echo "회차 $round: $(echo "$body" | head -c 400)"
            [ "$(echo "$body" | jq -r '.more // false' 2>/dev/null)" = "true" ] || exit 0
            sleep 2
          done

  notify:
    needs: latest
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 저장 조건 알림 메일
        env:
          SITE: https://jiwon.knowhow-it.com
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -u
          body=$(curl -sS --max-time 120 -H "Authorization: Bearer $CRON_SECRET" "$SITE/api/cron/notify") || { echo "요청 실패"; exit 1; }
          echo "$body" | head -c 600; echo
