name: tistory-top10-daily

# 매일 13:00 KST(04:00 UTC) 한 편: pipeline/top10_plan.json 에서 그날 주제를 꺼내
#   1) top10.py 로 jiwon(blog_posts)에 순위 글을 쓰고(출처가 된다)
#   2) chart_top10.py 로 자료 차트 12장 + 접수 중 공고 화면 1장을 만들고
#   3) tistory_publish.py --composer top10 으로 티스토리용 글을 따로 써서 공개로 올린다.
# 그날 주제가 없으면 조용히 끝난다. 쿠키가 만료되면 빨갛게 실패한다(README '티스토리' 절).
#
# 손으로: Run workflow → topic(기획표 대신 이 주제) 또는 date(그날 주제), visibility, dry, update(글 번호 고쳐 쓰기).
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "주제 키(top10.py --list). 비우면 date/오늘의 기획표 주제"
        required: false
        type: string
      date:
        description: "기획표에서 이 날짜(YYYY-MM-DD)의 주제. 비우면 오늘(KST)"
        required: false
        type: string
      visibility:
        default: "public"
        type: choice
        options: ["public", "private", "protected"]
      dry:
        description: "티스토리에 올리지 않고 글·차트만 만들어 본다(jiwon 에는 쓴다)"
        default: false
        type: boolean
      update:
        description: "새 글 대신 이 티스토리 글 번호를 고쳐 쓴다"
        required: false
        type: string
  schedule:
    - cron: "0 4 * * *"    # UTC 04:00 = KST 13:00

concurrency:
  group: tistory-publish
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt matplotlib
      - run: python pipeline/test_top10.py && python pipeline/test_tistory_publish.py
      - name: 오늘 주제 고르기
        id: pick
        env:
          TOPIC: ${{ inputs.topic }}
          DATE: ${{ inputs.date }}
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, datetime as dt
          topic = os.environ.get("TOPIC") or ""
          if not topic:
              d = os.environ.get("DATE") or (dt.datetime.utcnow() + dt.timedelta(hours=9)).date().isoformat()
              plan = json.load(open("pipeline/top10_plan.json", encoding="utf-8"))
              topic = next((p["topic"] for p in plan if p["date"] == d), "")
              print(f"date={d}")
          print(f"topic={topic}")
          EOF
      - name: 주제 없음
        if: steps.pick.outputs.topic == ''
        run: echo "::notice::오늘(${{ steps.pick.outputs.date }}) 기획표에 주제가 없다. 끝."
      - name: jiwon 에 순위 글 쓰기
        if: steps.pick.outputs.topic != ''
        id: write
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TOPIC: ${{ steps.pick.outputs.topic }}
        run: |
          python -u pipeline/top10.py --topic "$TOPIC" | tee out.txt
          grep '^SLUG=' out.txt >> "$GITHUB_OUTPUT"
      - name: 화면 사진 + 자료 차트
        if: steps.pick.outputs.topic != ''
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SLUG: ${{ steps.write.outputs.SLUG }}
        run: |
          sudo apt-get install -y -qq fonts-nanum >/dev/null 2>&1 || echo "::warning::fonts-nanum 설치 실패"
          fc-cache -f >/dev/null 2>&1 || true
          python -u pipeline/shot_pages.py "/jobs/status/open|open|지금 접수 중인 공공기관 채용 공고 (출처: K나라지원)|" || echo "::warning::화면 사진 실패 — 차트만 넣는다"
          python -u pipeline/chart_top10.py --slug "$SLUG"
      - uses: actions/upload-artifact@v4
        if: always() && steps.pick.outputs.topic != ''
        with:
          name: shots
          path: shots/
          if-no-files-found: ignore
          retention-days: 7
      - name: 티스토리에 올리기
        if: steps.pick.outputs.topic != '' && !inputs.dry
        env:
          TISTORY_COOKIE:       ${{ secrets.TISTORY_COOKIE }}
          TISTORY_CATEGORY:     ${{ vars.TISTORY_CATEGORY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SLUG: ${{ steps.write.outputs.SLUG }}
          VISIBILITY: ${{ inputs.visibility || 'public' }}
          UPDATE: ${{ inputs.update }}
        run: |
          [ -n "$TISTORY_COOKIE" ] || { echo "::error::TISTORY_COOKIE 가 없다"; exit 1; }
          args="--slug \"$SLUG\" --mode full --visibility $VISIBILITY --composer top10 --images shots/manifest.json"
          [ -n "$UPDATE" ] && args="$args --update \"$UPDATE\""
          eval python -u pipeline/tistory_publish.py $args
