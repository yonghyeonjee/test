name: collect-manual

# 손으로만 돌린다. 항목 하나 또는 전부를 지금 다시 받는다. (나라일터 과거 채록은 2020년까지 모은 뒤 2026-10-08 코드에서 뺐다.)
# 2026-10-08 부터 러너가 web/scripts/cron.ts 로 직접 돈다(서버를 부르지 않는다).
# 필요한 secret: NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_KEY, DATA_GO_KR_KEY(API 로 걷는 과거·해외취업), ALIOPLUS_*(공공기관)

on:
  workflow_dispatch:
    inputs:
      source:
        description: "무엇을 (all=매일 것 전부, 비우면 해외취업만)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - all
          - gojobs
          - worldjob
          - license
          - exam
          - agency_business
          - agency_event
          - agency_facility
          - jeonse
      minutes:
        description: "작업 하나에 주는 최대 분"
        required: false
        default: "25"

concurrency:
  group: collect-manual
  cancel-in-progress: false

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
  ALIOPLUS_API_KEY: ${{ secrets.ALIOPLUS_API_KEY }}
  ALIOPLUS_KEY_APBA: ${{ secrets.ALIOPLUS_KEY_APBA }}
  ALIOPLUS_KEY_BUSINESS: ${{ secrets.ALIOPLUS_KEY_BUSINESS }}
  ALIOPLUS_KEY_EVENT: ${{ secrets.ALIOPLUS_KEY_EVENT }}
  ALIOPLUS_KEY_FACILITY: ${{ secrets.ALIOPLUS_KEY_FACILITY }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/runner-cron
        with:
          jobs: ${{ inputs.source == 'all' && 'latest' || inputs.source == '' && 'source:worldjob' || format('source:{0}', inputs.source) }}
          minutes: ${{ inputs.minutes || '25' }}
