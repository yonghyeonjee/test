name: qnet-site

# 큐넷 종목별 시험 일정·수험자 동향. 매주 일요일 04:10 KST.
# 2026-10-08 부터 러너가 web/scripts/cron.ts qnet 으로 직접 돈다(서버를 부르지 않는다). 러너에서 큐넷이 열리는 것을 확인했다.
# 처음 한 번은 종목 613개 × 요청 7개라 오래 걸린다. 그 뒤로는 주마다 일정만 다시 읽는다(몇 분).
# 필요한 secret: NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_KEY

on:
  schedule:
    - cron: "10 19 * * 6"   # UTC 토 19:10 = KST 일 04:10
  workflow_dispatch:
    inputs:
      minutes:
        description: "최대 분"
        required: false
        default: "120"

concurrency:
  group: qnet-site
  cancel-in-progress: false

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/runner-cron
        with:
          jobs: qnet
          minutes: ${{ inputs.minutes || '120' }}
